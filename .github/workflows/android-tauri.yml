name: Android Tauri Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 缓存 key 的一部分:工具链升级后缓存自动失效,避免存有旧 rustc 产物的 wasm/目标
      # 被指纹误判为 fresh 而混入新构建(closure-shim hash 随 rustc 版本变化)。
      RUST_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK / platforms / build-tools
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" --sdk_root="$ANDROID_HOME"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      # 工具链固定为生成/提交 webui/dist 用的版本(否则 CI 重建的 wasm 与提交产物不一致,
      # “Verify committed dist is fresh” 会失败)。升级时:本地重建 dist 后同步此版本号。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Add android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            app/src-tauri/target
            webui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ env.RUST_TOOLCHAIN }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}

      # 复用验证:移动侧与 Linux 侧同一份 ble 模块(帧/分片/MeshOverlay),feature ble-mobile 下全量单测
      - name: Test shared zoe code with ble-mobile
        run: cargo test -p zoe-transport --no-default-features --features ble-mobile --lib

      # Web UI(Rust/Leptos → wasm):桌面 daemon 与移动端共用同一份产物。
      # dist 已提交(daemon 与 Tauri app 编译期 include_str!/include_bytes! 内嵌)。
      # wasm 的 closure-shim 导出名哈希与构建环境的细节(路径/CARGO_HOME 等)相关,
      # 无法在本机复现 CI 字节 —— 因此以 CI 自身重建结果为权威:不一致时自动提交
      # 重建产物(自收敛;此后运行凭指纹复用同一字节,dist 恒与 APK 内嵌一致)。
      - name: Test webui (native unit tests)
        run: cargo test --manifest-path webui/Cargo.toml

      - name: Install wasm-bindgen-cli
        run: |
          WBG=$(awk '/^name = "wasm-bindgen"$/{getline; print $3; exit}' webui/Cargo.lock | tr -d '"')
          cargo install wasm-bindgen-cli --version "$WBG" --locked

      - name: Build webui wasm dist
        run: bash webui/scripts/build.sh

      - name: Regenerate committed dist if stale (CI 字节为权威)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webui/dist
          if git diff --cached --quiet -- webui/dist; then
            echo "dist is fresh"
          else
            echo "dist 与 CI 重建不一致 —— 提交并推送本机(CI)重建产物"
            git commit -m "ci: regenerate webui/dist (run $GITHUB_RUN_ID)"
            git push origin HEAD:main
          fi

      # tauri CLI 经 cargo 安装(无 npm/Node 依赖)。
      - name: Install tauri CLI (cargo, no npm)
        run: cargo install tauri-cli --locked

      - name: Init android project (missing 时生成;gen/android 不入库)
        working-directory: app
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            cargo tauri android init
          fi

      # M1:canonical Kotlin(android/ble/*.kt)同步进 gen/android + MainActivity/Manifest patch。
      # 顺序:init → sync → patch → build。
      - name: Sync Kotlin BLE sources (android/ → gen/android)
        working-directory: app
        run: bash ../scripts/sync-android-ble.sh

      - name: Patch generated android project (MainActivity / Manifest, M1)
        working-directory: app
        run: bash ../scripts/patch-android-gen.sh

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          # release 构建(默认 profile 即 release,无需 --release;Tauri 默认以 debug keystore 签发,可侧载,无需单独签名配置)
          cargo tauri android build --apk 2>&1 | tee /tmp/build.log

      - name: Verify APK
        run: |
          APK=$(find app/src-tauri/gen/android -name '*.apk' | head -1)
          test -n "$APK"
          echo "apk=$APK"
          ls -la "$APK"
          sha256sum "$APK"
          echo "--- native libs (zoe-core/zoe-transport 编入证明) ---"
          unzip -l "$APK" | grep -E '\.so$'
          echo "--- badging ---"
          aapt dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zoe-mobile-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

      - name: Publish M1 report to ci/report
        if: always()
        run: |
          mkdir -p ci
          {
            echo "job: ${{ job.status }}"
            echo "run: $GITHUB_RUN_ID"
            echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            APK=$(find app/src-tauri/gen/android -name '*.apk' | head -1)
            if [ -n "$APK" ]; then
              echo "apk: $APK"
              ls -la "$APK" | awk '{print "size_bytes:", $5}'
              sha256sum "$APK" | awk '{print "sha256:", $1}'
              echo "--- native libs ---"
              unzip -l "$APK" | grep -E '\.so$' || true
              echo "--- badging ---"
              aapt dump badging "$APK" | grep -E "^(package|application-label|sdkVersion|targetSdkVersion|native-code)" || true
            else
              echo "apk: NONE"
            fi
            if [ "${{ job.status }}" = "failure" ]; then
              echo "--- build log tail ---"
              tail -120 /tmp/build.log 2>/dev/null || true
              echo "--- dist diff (wasm 重建与提交不一致时定位) ---"
              git diff --stat -- webui/dist || true
              git diff --no-color -- webui/dist | head -250 || true
            fi
          } > ci/m1-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci/m1-report.txt
          git commit -m "ci: M1 report (run $GITHUB_RUN_ID, ${{ job.status }})" --allow-empty
          git push --force origin HEAD:ci/report
