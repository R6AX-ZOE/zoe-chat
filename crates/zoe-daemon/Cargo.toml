[package]
name = "zoe-daemon"
version.workspace = true
edition.workspace = true
description = "zoe-chat daemon: local HTTP/WS API + embedded web UI (lib: shared with Tauri mobile)"

[features]
default = ["net", "lan", "sigmesh"]
# libp2p 打洞/直连(移动端已启用,2026-08-21)
net = ["zoe-transport/net"]
# 局域网传输(组播发现 + TCP 信封流,桌面/移动端共用)
lan = ["zoe-transport/lan"]
# SIG Mesh 洪泛堆栈(真实介质经 DaemonConfig.sigmesh_net 注入;缺省 FloodHub mock)
sigmesh = ["zoe-transport/sigmesh"]

[dependencies]
zoe-core = { path = "../zoe-core" }
zoe-transport = { path = "../zoe-transport", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
thiserror = "2"
futures-util = "0.3"
