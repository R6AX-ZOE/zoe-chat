name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 缓存 key 的一部分:工具链升级后缓存自动失效,避免旧 rustc 产物的 wasm 被复用
      #(closure-shim hash 随 rustc 版本变化,混入会导致 dist 校验失败)。
      RUST_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@v4

      # 工具链固定为生成/提交 webui/dist 用的版本(否则 CI 重建的 wasm 与提交产物不一致,
      # “Verify committed dist is fresh” 会失败)。升级时:本地重建 dist 后同步此版本号。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Add wasm target (webui)
        run: rustup target add wasm32-unknown-unknown

      - name: Install system deps (dbus for bluer on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            webui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ env.RUST_TOOLCHAIN }}

      # Web UI(Rust/Leptos → wasm,无 npm/tsc):dist 已提交(zoe-daemon 编译期内嵌)。
      # wasm 产物带 rustc 的 closure-shim 哈希(含宿主信息),Windows 与 Linux 构建不一致,
      # 故基准 = Linux 构建:仅在 Linux 上重建并校验提交的 dist(提交前需在 Linux 上跑一遍 build.sh,
      # 可借容器:docker run --rm -v $PWD:/repo rust:1.93 bash webui/scripts/build.sh)。
      - name: Test webui (native unit tests)
        run: cargo test --manifest-path webui/Cargo.toml

      - name: Install wasm-bindgen-cli
        if: runner.os == 'Linux'
        run: |
          WBG=$(awk '/^name = "wasm-bindgen"$/{getline; print $3; exit}' webui/Cargo.lock | tr -d '"')
          cargo install wasm-bindgen-cli --version "$WBG" --locked

      - name: Build webui wasm dist
        if: runner.os == 'Linux'
        run: bash webui/scripts/build.sh

      - name: Verify committed dist is fresh
        if: runner.os == 'Linux'
        run: |
          git diff --exit-code -- webui/dist || { echo "webui/dist 与最新源码不一致 —— 在 Linux(或容器)跑 webui/scripts/build.sh 后提交 dist"; exit 1; }

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test BLE mesh overlay (mock driver)
        if: runner.os == 'Linux'
        run: cargo test -p zoe-transport --features ble-linux

      - name: Test BLE mesh overlay (mock driver)
        if: runner.os == 'Windows'
        run: cargo test -p zoe-transport --features ble-windows

      - name: Test SIG Mesh adapter (mock flood network)
        run: cargo test -p zoe-transport --no-default-features --features sigmesh

      - name: Check Linux BLE driver (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo check -p zoe-transport --no-default-features --features ble-linux

      - name: Check Linux BLE CLI (ubuntu only)
        if: runner.os == 'Linux'
        run: cargo check -p zoe-cli --features ble-linux

      - name: Check Windows BLE CLI (windows only)
        if: runner.os == 'Windows'
        run: cargo check -p zoe-cli --features ble-windows

      - name: Build release
        run: cargo build --release --workspace
