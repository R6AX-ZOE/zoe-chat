[package]
name = "zoe-transport"
version.workspace = true
edition.workspace = true
description = "zoe-chat transport abstraction and implementations"

[features]
default = ["net"]
net = ["dep:libp2p"]
ble-linux = ["dep:bluer"]
ble-windows = ["dep:btleplug", "dep:windows", "dep:windows-future"]
# mobile(android):复用 ble 模块的帧/MeshOverlay 纯逻辑,无平台驱动
# (linux/windows 子模块已被 cfg 门控,android 目标下不编译)
ble-mobile = []
# SIG Mesh 适配(docs/DESIGN.md §6.3):纯逻辑,无平台依赖(真机网络层经 trait 接入)
sigmesh = []

[dependencies]
zoe-core = { path = "../zoe-core" }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "io-util", "net"] }
thiserror = "2"
hex = "0.4"
uuid = "1"
futures-util = "0.3"
libp2p = { version = "0.56", features = ["tcp", "tokio", "mdns", "dcutr", "noise", "yamux", "identify", "macros", "request-response", "cbor", "ed25519", "dns"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# bluetoothd feature:gatt/Adapter/Session 等均在其后门控,必须启用
bluer = { version = "0.17", features = ["bluetoothd"], optional = true }

[target.'cfg(windows)'.dependencies]
btleplug = { version = "0.12", optional = true }
windows = { version = "0.62", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Radios",
  "Foundation",
], optional = true }
windows-future = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net"] }
