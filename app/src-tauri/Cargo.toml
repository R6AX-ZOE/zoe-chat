[package]
name = "zoe-mobile"
version = "0.1.0"
description = "zoe-mobile: Tauri 2 mobile app embedding zoe-core + zoe-transport(ble-mobile) + embedded zoe-daemon"
edition = "2021"

[lib]
name = "zoe_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rand = "0.8"
# 回环 TCP 桥(M1):tokio 与 tauri 分开 feature 组合
# (net/io-util/time/sync/rt/macros 覆盖 select!/async IO),CI 生成 Cargo.lock
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
# 复用 Linux 侧同一份代码:帧/分片/去重/TTL/MeshOverlay 来自 zoe-transport::ble,
# default-features=false 排除 libp2p(net),移动端瘦身
zoe-core = { path = "../../crates/zoe-core" }
zoe-transport = { path = "../../crates/zoe-transport", default-features = false, features = ["ble-mobile"] }
# 内嵌守护进程(Web UI + HTTP/WS API):lib 化 zoe-daemon,关闭 net(libp2p)
zoe-daemon = { path = "../../crates/zoe-daemon", default-features = false }

# 独立于根 cargo workspace(自带 Cargo.lock,由 CI/有网络机器生成后提交)
[workspace]
