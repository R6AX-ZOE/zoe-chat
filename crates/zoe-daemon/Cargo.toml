[package]
name = "zoe-daemon"
version.workspace = true
edition.workspace = true
description = "zoe-chat daemon: local HTTP/WS API + embedded web UI"

[dependencies]
zoe-core = { path = "../zoe-core" }
zoe-transport = { path = "../zoe-transport", features = ["net"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
thiserror = "2"
futures-util = "0.3"
